name: Apply Orders Page Professional Toolbar

on:
  push:
    branches:
      - agent/orders-page-professional-toolbar

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orders-page-professional-toolbar
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refactor
        run: python scripts/apply-orders-page-ui.py
      - name: Verify targeted changes
        run: |
          npm ci
          npm run typecheck
          node --test tests/ordersProfessionalListRegression.test.ts
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ترقية صفحة أوامر البيع وتجميع الفلاتر والإجراءات"
          git push origin HEAD:agent/orders-page-professional-toolbar
