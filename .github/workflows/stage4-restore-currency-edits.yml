name: Stage 4 restored-file currency edits

on:
  push:
    branches:
      - agent/central-currency-stage-4

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/central-currency-stage-4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/stage4-restore-currency-edits.mjs
      - run: npm run typecheck
      - run: rm scripts/stage4-restore-currency-edits.mjs .github/workflows/stage4-restore-currency-edits.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply currency edits to restored full files"
          git push origin HEAD:agent/central-currency-stage-4
