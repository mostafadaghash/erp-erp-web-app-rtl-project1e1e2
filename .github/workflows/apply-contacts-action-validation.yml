name: Apply contacts action validation

on:
  push:
    branches: [codex/contacts-action-validation]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply validated contact UI patch
        run: node scripts/apply-contact-action-validation.mjs
      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-contact-action-validation.mjs
          rm .github/workflows/apply-contacts-action-validation.yml
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CustomersPage.tsx src/components/SuppliersPage.tsx tests/customerSupplierUiRegression.test.ts scripts/apply-contact-action-validation.mjs .github/workflows/apply-contacts-action-validation.yml
          git diff --cached --quiet && { echo "No patch changes produced"; exit 1; }
          git commit -m "Wire contact action validation"
          git push
