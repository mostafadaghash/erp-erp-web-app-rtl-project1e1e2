name: Normalize Commercial UI Labels

on:
  push:
    branches:
      - agent/commercial-ui-labels
    paths:
      - scripts/normalize-commercial-ui-labels.mjs
      - .github/workflows/normalize-commercial-ui-labels.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/commercial-ui-labels
          fetch-depth: 0

      - name: Normalize commercial labels
        run: node scripts/normalize-commercial-ui-labels.mjs

      - name: Commit normalized labels and remove temporary automation
        shell: bash
        run: |
          git rm scripts/normalize-commercial-ui-labels.mjs .github/workflows/normalize-commercial-ui-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "توحيد مسميات الخصم والإجمالي تجاريًا"
          git push origin HEAD:agent/commercial-ui-labels
