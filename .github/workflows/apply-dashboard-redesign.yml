name: Apply dashboard redesign
on:
  push:
    branches:
      - agent/dashboard-redesign-work
    paths:
      - .github/workflows/apply-dashboard-redesign.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebuild transformation
        shell: bash
        run: |
          cat .github/dashboard-redesign/part0* | base64 -d | xz -d > /tmp/apply_dashboard_redesign.py
          python3 -m py_compile /tmp/apply_dashboard_redesign.py
      - name: Apply and finalize redesign
        run: python3 .github/dashboard-redesign/finalize.py /tmp/apply_dashboard_redesign.py
      - name: Align contract tests with production sources
        run: python3 .github/dashboard-redesign/patch-contract-tests.py
      - name: Remove transient tooling
        shell: bash
        run: |
          rm -rf .github/dashboard-redesign
          rm -f .github/workflows/apply-dashboard-redesign.yml
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Dashboard and lifecycle contracts
        run: node --test --test-concurrency=1 --experimental-strip-types tests/dashboardCommercialSecurity.test.ts tests/dashboardOperationalLifecycle.test.ts tests/dashboardHeaderResponsiveCommercial.test.ts
      - name: Unit and integration tests
        run: npm test
      - name: Security
        run: npm run security:check
      - name: Production build
        run: npm run build
      - name: Commit verified redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Redesign dashboard header notifications and repair lifecycle"
          git push origin HEAD:agent/dashboard-redesign-work
