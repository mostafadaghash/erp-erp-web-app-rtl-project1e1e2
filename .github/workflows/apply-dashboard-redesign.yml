name: Apply dashboard redesign
on:
  push:
    branches:
      - agent/dashboard-redesign-work
    paths:
      - .github/workflows/apply-dashboard-redesign.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebuild transformation
        shell: bash
        run: |
          cat .github/dashboard-redesign/part0* | base64 -d | xz -d > /tmp/apply_dashboard_redesign.py
          python3 -m py_compile /tmp/apply_dashboard_redesign.py
      - name: Patch current repair UI anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply_dashboard_redesign.py')
          s = p.read_text(encoding='utf-8')
          old = "pattern = r'(  useEffect\\(\\(\\) => \\{\\n    if \\(createRequestToken && canCreate\\) setShowForm\\(true\\);\\n  \\}, \\[createRequestToken, canCreate\\]\\);\\n)'"
          new = "pattern = r'(  useEffect\\(\\(\\) => \\{\\n    if \\(createRequestToken && canCreate\\) openNewRepair\\(\\);\\n  \\}, \\[createRequestToken, canCreate\\]\\);\\n)'"
          if old not in s:
              raise SystemExit('old RepairsPage effect pattern not found in transformer')
          s = s.replace(old, new, 1)
          marker = "write('src/components/RepairsPage.tsx', repair_ui)"
          injection = '''repair_ui = repair_ui.replace(\n    '    { key: "pending", label: "قيد الإنتظار", value: repairCounts?.pending ?? 0, icon: Clock },',\n    '    { key: "pending", label: "قيد الإنتظار", value: repairCounts?.pending ?? 0, icon: Clock },\\n    { key: "technician_received", label: "تم الاستلام من الفني", value: repairCounts?.received_by_technician ?? 0, icon: CheckCircle },',\n    1,\n)\nrepair_ui = repair_ui.replace('shipping_rejected', 'technician_rejected').replace('مرفوض من شركة الشحن', 'مرفوض من الفني').replace('rejected_by_shipping', 'rejected_by_technician')\n'''
          if marker not in s:
              raise SystemExit('RepairsPage write marker not found in transformer')
          s = s.replace(marker, injection + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile /tmp/apply_dashboard_redesign.py
      - name: Apply redesign
        shell: bash
        run: python3 /tmp/apply_dashboard_redesign.py
      - name: Remove transient payload
        shell: bash
        run: rm -rf .github/dashboard-redesign
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Dashboard contracts
        run: node --test --test-concurrency=1 --experimental-strip-types tests/dashboardCommercialSecurity.test.ts tests/dashboardOperationalLifecycle.test.ts tests/dashboardHeaderResponsiveCommercial.test.ts
      - name: Security
        run: npm run security:check
      - name: Production build
        run: npm run build
      - name: Commit verified redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Redesign dashboard header notifications and repair lifecycle"
          git push origin HEAD:agent/dashboard-redesign-work
