name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dependency audit
        run: npm audit --audit-level=low
      - name: Typecheck
        run: npm run typecheck
      - name: Orders pagination guard
        if: always()
        run: node --test --experimental-strip-types tests/ordersPaginationGuard.test.ts
      - name: Full tests
        if: always()
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          if-no-files-found: error
          retention-days: 1
      - name: Security check
        if: always()
        run: npm run security:check
      - name: Build
        if: always()
        run: npm run build
      - name: Release candidate preflight
        if: always()
        run: npm run release:preflight

  browser-contract:
    name: browser-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned Playwright runner without changing lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1
      - name: Compile and discover browser tests
        run: npx playwright test --list

  release-gate:
    name: release-gate
    needs: [verify, browser-contract]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful verification and browser contract
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          BROWSER_CONTRACT_RESULT: ${{ needs.browser-contract.result }}
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$BROWSER_CONTRACT_RESULT" = "success"
          echo "CI release gate passed."
