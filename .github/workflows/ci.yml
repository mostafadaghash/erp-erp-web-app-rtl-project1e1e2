name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Runtime version guard
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
      - run: npm ci --ignore-scripts
      - name: Dependency audit
        run: npm audit --audit-level=low
      - name: Typecheck
        run: npm run typecheck
      - name: Orders pagination guard
        if: always()
        run: node --test --experimental-strip-types tests/ordersPaginationGuard.test.ts
      - name: Full tests
        if: always()
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          if-no-files-found: error
          retention-days: 1
      - name: Upload browser printing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printing-acceptance
          path: test-results/printing
          if-no-files-found: error
          retention-days: 1
      - name: Security check
        if: always()
        run: npm run security:check
      - name: Build
        if: always()
        run: npm run build
      - name: Release candidate preflight
        if: always()
        run: npm run release:preflight

  backend-verify:
    name: backend-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_backend_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_backend_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Runtime version guard
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
      - run: npm ci --ignore-scripts
      - name: Dependency audit
        run: npm audit --audit-level=low
      - name: Backend secret and security scan
        run: node scripts/backend-security-check.mjs
      - name: Backend typecheck
        run: npm run backend:typecheck
      - name: Backend unit tests
        run: npm run backend:test
      - name: Transaction helper unit tests
        run: node --import tsx --test server/tests/transaction-helper.test.ts
      - name: PostgreSQL transaction integration tests
        env:
          ERP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_backend_ci
        run: node --import tsx --test server/tests/transaction-helper.integration.test.ts
      - name: PostgreSQL Idempotency Service integration tests
        env:
          ERP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_backend_ci
        run: node --import tsx --test server/tests/idempotency-service.integration.test.mjs
      - name: PostgreSQL Document Sequence Service integration tests
