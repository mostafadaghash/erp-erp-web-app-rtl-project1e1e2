name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Orders pagination guard
        if: always()
        run: node --test --experimental-strip-types tests/ordersPaginationGuard.test.ts
      - name: Full tests
        if: always()
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          if-no-files-found: error
          retention-days: 1
      - name: Security check
        if: always()
        run: npm run security:check
      - name: Build
        if: always()
        run: npm run build

  release-gate:
    name: release-gate
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful verification
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$VERIFY_RESULT" = "success"
          echo "CI release gate passed."
