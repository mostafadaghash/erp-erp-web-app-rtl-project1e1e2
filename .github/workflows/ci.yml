name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply structured audit snapshots
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/apply-audit-structured-snapshots.py
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add convex/schema.ts convex/lib/auth.ts convex/auditLogs.ts src/components/AuditLogsPage.tsx convex/branches.ts convex/settings.ts convex/customers.ts convex/suppliers.ts convex/products.ts convex/employees.ts
            git commit -m "feat: add structured audit snapshots"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Orders pagination guard
        if: always()
        run: node --test --experimental-strip-types tests/ordersPaginationGuard.test.ts
      - name: Full tests
        if: always()
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          if-no-files-found: error
          retention-days: 1
      - name: Security check
        if: always()
        run: npm run security:check
      - name: Build
        if: always()
        run: npm run build
