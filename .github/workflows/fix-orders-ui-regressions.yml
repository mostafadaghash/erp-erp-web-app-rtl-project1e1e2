name: Fix Orders UI Regressions

on:
  push:
    branches:
      - agent/orders-page-professional-toolbar

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orders-page-professional-toolbar
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore guarded commercial wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/OrdersPage.tsx')
          s=p.read_text(encoding='utf-8')
          old='التسليم من الشحن'
          new='التسليم من عملية الشحن'
          if old not in s:
              raise SystemExit('wording marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/fix-orders-ui-regressions.yml').unlink()
          PY
      - name: Verify full suite
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ضبط توافق اختبارات واجهة أوامر البيع"
          git push origin HEAD:agent/orders-page-professional-toolbar
