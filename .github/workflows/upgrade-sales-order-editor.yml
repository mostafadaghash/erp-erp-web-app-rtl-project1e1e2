name: Upgrade Sales Order Editor

on:
  push:
    branches:
      - agent/professional-sales-order-editor
    paths:
      - scripts/upgrade-sales-order-editor.mjs
      - .github/workflows/upgrade-sales-order-editor.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/professional-sales-order-editor
          fetch-depth: 0
      - name: Apply upgrade
        run: node scripts/upgrade-sales-order-editor.mjs
      - name: Commit upgrade
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/OrdersPage.tsx convex/orders.ts convex/schema.ts
          git commit -m "ترقية شاشة أوامر البيع وربط الأصناف بالمخزون"
          git push origin HEAD:agent/professional-sales-order-editor
