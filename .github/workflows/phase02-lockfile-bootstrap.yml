name: Phase 02 Lockfile Bootstrap

on:
  push:
    branches:
      - agent/postgres-v1.7-core

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/postgres-v1.7-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Update backend manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.scripts = {
            ...pkg.scripts,
            'backend:dev': 'tsx watch server/main.ts',
            'backend:typecheck': 'tsc -p server/tsconfig.json --noEmit --pretty false',
            'backend:test': 'node --import tsx --test server/tests/*.test.ts',
            'backend:build': 'tsc -p server/tsconfig.json',
            'backend:start': 'node dist-server/main.js',
            'backend:verify': 'npm run backend:typecheck && npm run backend:test && npm run backend:build'
          }
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
      - name: Resolve exact backend dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact fastify@5.12.3 @fastify/env@7.0.0 pg@8.23.0 pino@10.3.1
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact tsx@4.23.13 @types/pg@8.23.1
      - name: Verify generated manifest
        run: |
          node -e "const p=require('./package.json'); const expected={fastify:'5.12.3','@fastify/env':'7.0.0',pg:'8.23.0',pino:'10.3.1'}; for (const [k,v] of Object.entries(expected)) if(p.dependencies?.[k]!==v) throw new Error(k); const dev={tsx:'4.23.13','@types/pg':'8.23.1'}; for (const [k,v] of Object.entries(dev)) if(p.devDependencies?.[k]!==v) throw new Error(k)"
          npm audit --audit-level=low
          git diff --check -- package.json package-lock.json
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "chore(phase-02): lock backend scaffold dependencies"
          git push origin HEAD:agent/postgres-v1.7-core
